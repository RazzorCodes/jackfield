[package]
name = "jackfield"
version = "0.1.0"
edition = "2024"

[dependencies]
uuid = { version = "1.8", features = ["v4"] }
bitflags = {version = "2.4"}
tokio = { version = "1", features = ["sync", "rt-multi-thread", "macros", "time"] }
tonic = "0.12"
prost = "0.13"

pyo3 = { version = "0.23", features = ["extension-module"], optional = true }

[build-dependencies]
tonic-build = "0.12"

[features]
python = ["dep:pyo3"]
# ---
default = []

[lib]
crate-type = ["cdylib", "rlib"]
